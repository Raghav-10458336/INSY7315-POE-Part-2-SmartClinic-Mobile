name: SmartClinic Mobile CI/CD

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test-package:
    name: Build, Test and Package Android App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android

      - name: Restore mobile project
        run: dotnet restore SmartClinic.Mobile/SmartClinic.Mobile.csproj

      - name: Restore test project
        run: dotnet restore SmartClinic.Mobile.Tests/SmartClinic.Mobile.Tests.csproj

      - name: Build Android mobile project
        run: dotnet build SmartClinic.Mobile/SmartClinic.Mobile.csproj --framework net10.0-android --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test SmartClinic.Mobile.Tests/SmartClinic.Mobile.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish Android APK
        run: >
          dotnet publish SmartClinic.Mobile/SmartClinic.Mobile.csproj
          --framework net10.0-android
          --configuration Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartClinic-Android-APK
          path: SmartClinic.Mobile/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 30